name: Build Windows Blackjack

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Blackjack
        run: mvn -B clean package "-Dmaven.test.skip=true"

      - name: Create packaging directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/package-input
          Copy-Item target/blackjack-1.0-SNAPSHOT.jar target/package-input/

      - name: Copy runtime dependencies
        run: >
          mvn -B dependency:copy-dependencies
          -DincludeScope=runtime
          -DoutputDirectory=target/package-input

      - name: Build Windows app
        shell: pwsh
        run: |
          jpackage `
            --type app-image `
            --name "TJ's Blackjack" `
            --input target/package-input `
            --main-jar blackjack-1.0-SNAPSHOT.jar `
            --main-class Main `
            --app-version 0.1.0 `
            --dest dist

      - name: Zip Windows app
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/TJ's Blackjack" `
            -DestinationPath "dist/TJ-Blackjack-Windows.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TJ-Blackjack-Windows
          path: dist/TJ-Blackjack-Windows.zip
          
