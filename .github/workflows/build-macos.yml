name: Build macOS Blackjack

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Blackjack
        run: mvn -B clean package "-Dmaven.test.skip=true"

      - name: Create packaging directory
        run: |
          mkdir -p target/package-input
          cp target/blackjack-1.0-SNAPSHOT.jar target/package-input/

      - name: Copy runtime dependencies
        run: >
          mvn -B dependency:copy-dependencies
          -DincludeScope=runtime
          -DoutputDirectory=target/package-input

      - name: Build macOS app
        run: |
          jpackage \
            --type app-image \
            --name "TJ's Blackjack" \
            --input target/package-input \
            --main-jar blackjack-1.0-SNAPSHOT.jar \
            --main-class Launcher \
            --app-version 1.0.0 \
            --dest dist

      - name: Zip macOS app
        run: |
          cd dist
          zip -r "TJ-Blackjack-macOS.zip" "TJ's Blackjack.app"

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: TJ-Blackjack-macOS
          path: dist/TJ-Blackjack-macOS.zip
          
